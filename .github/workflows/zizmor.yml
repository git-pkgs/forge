name: Zizmor

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - '**/action.yml'
      - '**/action.yaml'
      - 'zizmor.yml'
      - 'zizmor.yaml'
  pull_request:
    paths:
      - '.github/**'
      - '**/action.yml'
      - '**/action.yaml'
      - 'zizmor.yml'
      - 'zizmor.yaml'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
